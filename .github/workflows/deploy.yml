# Builds and publishes the map to GitHub Pages.
# Map tiles, photos and landmark data are pulled from gtadb's GitHub repo at build
# time (as they ask: no live requests to gtadb.org), so this repo stays small.
# Runs on every push to main, weekly to pick up new landmarks, and on demand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch gtadb tiles, photos and landmarks (CC BY 4.0)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/rolux/gtadb.org.git vendor/gtadb
          git -C vendor/gtadb sparse-checkout set maps/tiles/6/day map/data/6 map/photos/6
          rm -rf vendor/gtadb/.git
          touch .nojekyll
          du -sh vendor/gtadb

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
